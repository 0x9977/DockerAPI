# DockerAPI 部署示例(docs/deployment.md)
# 使用: 在仓库根目录执行
#   docker compose -f deploy/docker-compose.example.yml up -d --build
# group_add 的 GID 需与宿主机 docker 组一致: getent group docker | cut -d: -f3

services:
  dockerapi:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: dockerapi:1.0.0
    container_name: dockerapi
    restart: unless-stopped
    ports:
      - "8000:8000"          # 内网访问;公网暴露前须加 TLS 反代
    group_add:
      - "103"                # 宿主机 docker 组 GID,按实际修改!
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/stacks:/opt/stacks   # 路径内外保持一致
      - dockerapi-data:/data
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /data
      STACKS_DIR: /opt/stacks
      # DOCKER_HOST: unix:///var/run/docker.sock  # 默认,可改 tcp:///ssh://
      # AUDIT_RETENTION_DAYS: "90"
      # COMPOSE_JOB_TIMEOUT: "1800"

volumes:
  dockerapi-data:
